[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI Depends/Query/Form 是声明式依赖，不是可变默认值。

[tool.ruff.lint.per-file-ignores]
# 既有文件保持原样；原实现已校验长度或有意偏移配对。
"app/api/router.py" = ["I001"]
"app/ingestion/readers.py" = ["I001"]
"app/integrations/bge_client.py" = ["I001"]
"app/integrations/http_client.py" = ["I001"]
"app/integrations/reranker_client.py" = ["I001"]
"app/rag/document_split.py" = ["I001", "B905"]
"app/repositories/qdrant_repository.py" = ["I001", "B905"]
"app/schemas/api.py" = ["I001"]
"app/services/document_service.py" = ["I001"]
"app/services/search_service.py" = ["B905"]
